services:
  postgres_local:
    image: postgres:15-alpine
    container_name: gb_one_postgres_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gb_one -d gb_one_local"]
      interval: 10s
      timeout: 5s
      retries: 5