services:

  postgres_local:
    image: postgres:15-alpine
    container_name: gb_one_postgres_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - backend_network
    build:
      context: ./back_projeto
      dockerfile: Dockerfile
    container_name: gb_one_backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_local:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      postgres_local:
        condition: service_healthy
    restart: unless-stopped



  frontend:
    build:
      context: ./front_projeto
      dockerfile: Dockerfile
    container_name: gb_one_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backend_network
    command: sh -c "npm install && npm run build && npx serve -s dist -l 80"
    restart: unless-stopped


networks:
  backend_network:
    driver: bridge