apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: gustavovieira29/projeto_individual_ts-frontend:1.0.0
        ports:
        - containerPort: 5173
        env:
        - name: REACT_APP_API_URL
          value: http://backend-service:3000