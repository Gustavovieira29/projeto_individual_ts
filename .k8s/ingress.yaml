apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sistema-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx" # Especifica o controlador de ingresso a ser usado
spec:
  rules:
  - host: sistema.seudominio.com # Substitua pelo seu domínio
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend-service
              port:
                number: 5173
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 3000